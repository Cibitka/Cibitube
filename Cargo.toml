[package]
name = "metrolist-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.30"
egui_extras = { version = "0.30", features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "macros", "time"] }
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2.1"
dirs = "5.0"
