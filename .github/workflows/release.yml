name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libssl-dev pkg-config

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/release/metrolist-desktop dist/metrolist
          cp target/release/metrolist-desktop dist/cibitube
          chmod +x dist/metrolist dist/cibitube
          tar -czvf dist/cibitube-linux-x86_64.tar.gz -C dist cibitube metrolist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/cibitube-linux-x86_64.tar.gz
            dist/cibitube
            dist/metrolist
